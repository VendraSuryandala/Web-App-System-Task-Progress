<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omma IT Task Progress</title>
    <link rel="icon" type="image/png" href="logo-favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col" x-data="itApp()">
    <header style="background-color: #285355;" class="text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="logo-omma.png" alt="Omma Logo" class="h-10 w-auto">
                <div>
                    <h1 class="text-xl font-bold">Omma IT Task Progress</h1>
                    <p class="text-xs text-emerald-200 opacity-80">Google Sheets Records Sync Enabled</p>
                </div>
            </div>
            <a :href="sheetUrl" target="_blank" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm transition flex items-center gap-2 shadow-sm" title="Open Google Spreadsheet">
                <i class="fa-solid fa-file-excel"></i> <span class="hidden sm:inline">Spreadsheet</span>
            </a>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <template x-if="notification">
            <div class="mb-4 p-3 bg-emerald-50 text-emerald-800 border border-emerald-200 rounded-lg text-sm flex justify-between items-center">
                <span x-text="notification"></span>
                <button @click="notification = ''" class="font-bold">&times;</button>
            </div>
        </template>

        <!-- Records Tab -->
        <div class="space-y-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col lg:flex-row justify-between items-center gap-4">
                <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                    <div class="relative flex-grow sm:flex-grow-0 sm:w-64">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" x-model="search" placeholder="Cari task..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <select x-model="filterStatus" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                        <option value="">Semua Status</option>
                        <option value="DONE">DONE</option>
                        <option value="IN PROGRESS">IN PROGRESS</option>
                        <option value="PENDING">PENDING</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 w-full lg:w-auto justify-end">
                    <button @click="openModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-sm"><i class="fa-solid fa-plus"></i> Tambah Task</button>
                </div>
            </div>

            <div class="rounded-2xl overflow-hidden">
                <!-- Mobile View List -->
                <div class="block lg:hidden space-y-4 w-full">
                    <template x-for="r in filteredRecords" :key="r['TASK ID']">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border-2 border-slate-200 space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="font-mono text-xs font-bold text-blue-600" x-text="r['TASK ID']"></span>
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-100" x-text="r.STATUS"></span>
                            </div>
                            <div class="font-semibold text-slate-800 text-sm" x-text="r['TASK DESCRIPTION']"></div>
                            <div class="text-xs text-slate-500 p-2.5 rounded-xl">
                                <span class="font-medium text-slate-700" x-text="r.Site"></span> • 
                                <span x-text="r.DEVICE"></span> • 
                                <span x-text="formatDate(r['DATE ISSUE'])"></span>
                            </div>
                            <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                                <span class="text-xs text-slate-500 font-medium">PIC: <strong class="text-slate-700" x-text="r.PIC"></strong></span>
                                <div class="flex gap-1.5">
                                    <button @click="editRecord(r)" class="px-3 py-1.5 bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-600 rounded-lg text-xs font-medium transition flex items-center gap-1"><i class="fa-solid fa-pen"></i> Edit</button>
                                    <button @click="deleteRecord(r['TASK ID'])" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-medium transition flex items-center gap-1"><i class="fa-solid fa-trash"></i> Hapus</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Desktop View Table -->
                <div class="hidden lg:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 uppercase text-[11px] font-semibold border-b border-slate-200">
                                <th class="p-3.5">Task ID</th>
                                <th class="p-3.5">Date</th>
                                <th class="p-3.5">Site / Device</th>
                                <th class="p-3.5">Category</th>
                                <th class="p-3.5">Description</th>
                                <th class="p-3.5">PIC</th>
                                <th class="p-3.5">Status</th>
                                <th class="p-3.5 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-sm">
                            <template x-for="r in filteredRecords" :key="r['TASK ID']">
                                <tr class="hover:bg-slate-50 transition">
                                    <td class="p-3.5 font-mono text-xs font-bold text-blue-600" x-text="r['TASK ID']"></td>
                                    <td class="p-3.5 text-xs text-slate-600" x-text="formatDate(r['DATE ISSUE'])"></td>
                                    <td class="p-3.5">
                                        <div class="font-semibold text-slate-800" x-text="r.Site"></div>
                                        <div class="text-[11px] text-slate-400" x-text="r.DEVICE"></div>
                                    </td>
                                    <td class="p-3.5"><span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded text-[11px] font-medium" x-text="r.CATEGORY"></span></td>
                                    <td class="p-3.5 max-w-xs"><div class="font-medium text-slate-800 truncate" x-text="r['TASK DESCRIPTION']"></div></td>
                                    <td class="p-3.5 text-xs text-slate-600" x-text="r.PIC"></td>
                                    <td class="p-3.5"><span class="px-2.5 py-1 rounded-full text-[11px] font-semibold" :class="r.STATUS === 'DONE' ? 'bg-emerald-50 text-emerald-700 border border-emerald-100' : 'bg-amber-50 text-amber-700 border border-amber-100'" x-text="r.STATUS"></span></td>
                                    <td class="p-3.5 text-right space-x-1">
                                        <button @click="editRecord(r)" class="p-1.5 bg-slate-50 hover:bg-blue-50 text-slate-400 hover:text-blue-600 rounded-lg transition"><i class="fa-solid fa-pen text-[11px]"></i></button>
                                        <button @click="deleteRecord(r['TASK ID'])" class="p-1.5 bg-slate-50 hover:bg-rose-50 text-slate-400 hover:text-rose-600 rounded-lg transition"><i class="fa-solid fa-trash text-[11px]"></i></button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div x-show="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 overflow-y-auto" style="display: none;">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg" x-text="isEdit ? 'Edit Task' : 'Tambah Task Baru'"></h3>
                <button @click="showModal = false" class="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
            </div>
            <form @submit.prevent="saveRecord()" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Task ID</label>
                        <input type="text" x-model="form['TASK ID']" class="w-full px-3 py-2 bg-slate-100 border rounded-xl text-sm font-bold text-slate-500" readonly>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Site</label>
                        <select x-model="form.Site" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">-- Pilih Site --</option>
                            <option value="OMMA">OMMA</option>
                            <option value="HO">HO</option>
                            <option value="The Raz">The Raz</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Date Issue</label>
                        <input type="date" x-model="form['DATE ISSUE']" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Target Date</label>
                        <input type="date" x-model="form['TARGET DATE']" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Category</label>
                        <select x-model="form.CATEGORY" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                            <option value="FIXING">FIXING</option>
                            <option value="MAINTENANCE">MAINTENANCE</option>
                            <option value="TRAINING">TRAINING</option>
                            <option value="PROJECT">PROJECT</option>
                            <option value="DESIGN">DESIGN</option>
                            <option value="DAILY CASE">DAILY CASE</option>
                            
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Technical Category</label>
                        <select x-model="form['TECHNICAL CATEGORY']" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">-- Pilih Technical Category --</option>
                            <option value="HARDWARE.SERVERS">HARDWARE.SERVERS</option>
                            <option value="HARDWARE.WORKSTATION">HARDWARE.WORKSTATION</option>
                            <option value="HARDWARE.PERIPHERALS">HARDWARE.PERIPHERALS</option>
                            <option value="HARDWARE.NETWORK">HARDWARE.NETWORK</option>
                            <option value="HARDWARE.MISC / OTHERS">HARDWARE.MISC / OTHERS</option>
                            <option value="SOFTWARE.SERVERS">SOFTWARE.SERVERS</option>
                            <option value="SOFTWARE.OS">SOFTWARE.OS</option>
                            <option value="SOFTWARE.APPLICATION">SOFTWARE.APPLICATION</option>
                            <option value="SOFTWARE.MISC / OTHERS">SOFTWARE.MISC / OTHERS</option>
                            <option value="SERVICES.EMAIL">SERVICES.EMAIL</option>
                            <option value="SERVICES.CLOUD">SERVICES.CLOUD</option>
                            <option value="SERVICES.INTERNET">SERVICES.INTERNET</option>
                            <option value="SERVICES.LICENSE">SERVICES.LICENSE</option>
                            <option value="SERVICES.MISC / OTHERS">SERVICES.MISC / OTHERS</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Device</label>
                        <select x-model="form.DEVICE" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                            <option value="">-- Pilih Device --</option>
                            <option value="Infrastruktur">Infrastruktur</option>
                            <option value="PC">PC</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Tab">Tab</option>
                            <option value="Access Point">Access Point</option>
                            <option value="Router">Router</option>
                            <option value="Switch">Switch</option>
                            <option value="Monitor">Monitor</option>
                            <option value="Kabel">Kabel</option>
                            <option value="UPS">UPS</option>
                            <option value="Xero">Xero</option>
                            <option value="Server Room">Server Room</option>
                            <option value="Email">Email</option>
                            <option value="IOT">IOT</option>
                            <option value="CCTV">CCTV</option>
                            <option value="Phone">Phone</option>
                            <option value="Website">Website</option>
                            <option value="Server">Server</option>
                            <option value="Payment Gateway">Payment Gateway</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Action Plan</label>
                        <input type="text" x-model="form['ACTION PLAN']" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Task Description</label>
                    <textarea x-model="form['TASK DESCRIPTION']" rows="2" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Action Taken</label>
                        <input type="text" x-model="form['ACTION TAKEN']" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">PIC</label>
                        <select x-model="form.PIC" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">-- Pilih PIC --</option>
                            <option value="Yuda">Yuda</option>
                            <option value="Vendra">Vendra</option>
                            <option value="Training">Training</option>
                            <option value="Yuda & Vendra">Yuda & Vendra</option>
                            <option value="Yuda & Training">Yuda & Training</option>
                            <option value="Vendra & Training">Vendra & Training</option>
                            <option value="Yuda, Vendra & Training">Yuda, Vendra & Training</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Status</label>
                        <select x-model="form.STATUS" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                            <option value="DONE">DONE</option>
                            <option value="IN PROGRESS">IN PROGRESS</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Critical Issue?</label>
                        <select x-model="form['CRITICAL ISSUE? (YES/NO)']" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                            <option value="NO">NO</option>
                            <option value="YES">YES</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Solved Date</label>
                        <input type="date" x-model="form['SOLVED DATE']" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Remarks</label>
                        <input type="text" x-model="form.REMARKS" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Month</label>
                        <input type="text" x-model="form.MONTH" placeholder="October" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Year</label>
                        <input type="text" x-model="form.YEAR" placeholder="2026" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Data Quality</label>
                        <input type="text" x-model="form['DATA QUALITY']" value="OK" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Day Progress</label>
                        <div x-effect="form['DAY PROGRESS'] = calcDayProgress()">
                            <input type="text" :value="calcDayProgress()" class="w-full px-3 py-2 bg-slate-100 border rounded-xl text-sm font-bold text-blue-600" readonly>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" @click="showModal = false" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-medium" x-text="isEdit ? 'Simpan' : 'Tambah'"></button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal (Google Apps Script Web App URL) -->
    <div x-show="showSettings" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 overflow-y-auto" style="display: none;">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 space-y-4" @click.away="showSettings = false">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-cloud text-blue-600 mr-2"></i> Google Sheets Sync Settings</h3>
                <button @click="showSettings = false" class="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
            </div>
            <p class="text-xs text-slate-500">Masukkan URL Web App Google Apps Script dari Google Sheets Anda untuk mengaktifkan sinkronisasi otomatis.</p>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Web App URL</label>
                    <input type="text" x-model="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-mono">
                </div>
                <div class="flex justify-end gap-2 pt-3 border-t">
                    <button type="button" @click="showSettings = false" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm">Tutup</button>
                    <button type="button" @click="saveSettings()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-medium">Simpan URL</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function itApp() {
            return {
                notification: '',
                search: '',
                filterStatus: '',
                showModal: false,
                showSettings: false,
                isEdit: false,
                webAppUrl: 'https://script.google.com/macros/s/AKfycbzr4gcOE5wXex--hxHBQcp3w6HIn_GkFdeJP3SB0284KYBAX5mHwGWixu5EhaJrDhPU/exec',
                // Link Spreadsheet asli Anda
                sheetUrl: 'https://docs.google.com/spreadsheets/d/1EDvp8HMxoSQS0uUXJPR58euXrqWe4x1eVk-TYUQwTe0/edit',
                records: [],
                form: {},
                init() {
                    this.fetchData();
                },
                async fetchData() {
                    try {
                        const response = await fetch(this.webAppUrl);
                        this.records = await response.json();
                        localStorage.setItem('it_rec', JSON.stringify(this.records));
                    } catch (err) {
                        console.error('Gagal memuat data:', err);
                        const r = localStorage.getItem('it_rec');
                        if(r) try { this.records = JSON.parse(r); } catch(e){}
                    }
                },
                calcDayProgress: function() {
                    if (!this.form['TASK ID']) return '';
                    var startDate = this.form['DATE ISSUE'];
                    if (!startDate) return '';
                    var today = new Date();
                    var start = new Date(startDate);
                    var status = this.form.STATUS;
                    var solvedDate = this.form['SOLVED DATE'];
                    if (status === 'DONE') {
                        if (startDate && solvedDate) {
                            var solved = new Date(solvedDate);
                            return Math.max(0, Math.round((solved - start) / (1000 * 60 * 60 * 24)));
                        }
                        return '';
                    } else {
                        return Math.max(0, Math.round((today - start) / (1000 * 60 * 60 * 24)));
                    }
                },

                openModal() {
                    this.isEdit = false;
                    const num = String(this.records.length + 1).padStart(3, '0');
                    const today = new Date().toISOString().split('T')[0];
                    this.form = {
                        'TASK ID': 'IT-IR-' + num,
                        'DATE ISSUE': today,
                        'TARGET DATE': today,
                        'CATEGORY': 'FIXING',
                        'TECHNICAL CATEGORY': 'HARDWARE.NETWORK',
                        'Site': '',
                        'DEVICE': '',
                        'TASK DESCRIPTION': '',
                        'ACTION PLAN': '',
                        'ACTION TAKEN': '',
                        'STATUS': 'IN PROGRESS',
                        'CRITICAL ISSUE? (YES/NO)': 'NO',
                        'PIC': '',
                        'SOLVED DATE': '',
                        'REMARKS': '',
                        'DAY PROGRESS': '0',
                        'MONTH': 'November',
                        'YEAR': '2026',
                        'DATA QUALITY': 'OK'
                    };
                    this.showModal = true;
                },
                editRecord(r) { 
                    this.isEdit = true; 
                    let formattedRecord = { ...r };
                    
                    const toDateInput = (val) => {
                        if (!val) return '';
                        let d = new Date(val);
                        
                        // Handle format DD/MM/YYYY atau DD/MM/YY jika new Date gagal
                        if (isNaN(d.getTime()) && typeof val === 'string' && val.includes('/')) {
                            const p = val.split('/');
                            if (p.length === 3) {
                                let day = p[0].padStart(2, '0');
                                let month = p[1].padStart(2, '0');
                                let year = p[2].length === 2 ? '20' + p[2] : p[2];
                                d = new Date(year + '-' + month + '-' + day);
                            }
                        }
                        
                        if (isNaN(d.getTime())) return '';
                        
                        // Return YYYY-MM-DD
                        const y = d.getFullYear();
                        const m = ('0' + (d.getMonth() + 1)).slice(-2);
                        const day = ('0' + d.getDate()).slice(-2);
                        return y + '-' + m + '-' + day;
                    };

                    formattedRecord['DATE ISSUE'] = toDateInput(formattedRecord['DATE ISSUE']);
                    formattedRecord['TARGET DATE'] = toDateInput(formattedRecord['TARGET DATE']);
                    formattedRecord['SOLVED DATE'] = toDateInput(formattedRecord['SOLVED DATE']);

                    this.form = formattedRecord; 
                    this.form['DAY PROGRESS'] = this.calcDayProgress();
                    this.showModal = true; 
                },
                saveSettings() {
                    localStorage.setItem('it_sheets_url', this.webAppUrl);
                    this.showSettings = false;
                    this.notification = 'Google Sheets Web App URL berhasil disimpan!';
                },
                saveRecord() {
                    this.form['DAY PROGRESS'] = this.calcDayProgress();
                    let recordToSave = { ...this.form };
                    
                    // Ubah format tanggal ke DD-MM-YY sebelum dikirim ke Google Sheets
                    const toSheetDate = (val) => {
                        if (!val) return '';
                        const d = new Date(val);
                        if (isNaN(d.getTime())) return val;
                        const day = ('0' + d.getDate()).slice(-2);
                        const m = ('0' + (d.getMonth() + 1)).slice(-2);
                        const y = d.getFullYear();
                        return day + '-' + m + '-' + y;
                    };

                    recordToSave['DATE ISSUE'] = toSheetDate(recordToSave['DATE ISSUE']);
                    recordToSave['TARGET DATE'] = toSheetDate(recordToSave['TARGET DATE']);
                    recordToSave['SOLVED DATE'] = toSheetDate(recordToSave['SOLVED DATE']);

                    if(this.isEdit) {
                        const idx = this.records.findIndex(x => x['TASK ID'] === recordToSave['TASK ID']);
                        if(idx !== -1) this.records[idx] = recordToSave;
                        this.notification = 'Task diperbarui!';
                    } else {
                        this.records.unshift(recordToSave);
                        this.notification = 'Task ditambahkan!';
                    }
                    localStorage.setItem('it_rec', JSON.stringify(this.records));
                    this.showModal = false;

                    // Sync Save to Google Sheets
                    if(this.webAppUrl && this.webAppUrl.startsWith('http')) {
                        const formData = new URLSearchParams();
                        formData.append('payload', JSON.stringify({ action: 'save', record: recordToSave }));

                        fetch(this.webAppUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: formData.toString()
                        }).then(() => {
                            this.notification = 'Task tersimpan & tersinkronisasi ke Google Sheets!';
                        }).catch(err => {
                            console.error(err);
                            this.notification = 'Tersimpan lokal, gagal sync ke Sheets.';
                        });
                    }
                },
                deleteRecord(id) {
                    if(confirm('Hapus task ' + id + '?')) {
                        this.records = this.records.filter(x => x['TASK ID'] !== id);
                        localStorage.setItem('it_rec', JSON.stringify(this.records));
                        this.notification = 'Task dihapus!';

                        // Sync Delete to Google Sheets
                        if(this.webAppUrl && this.webAppUrl.startsWith('http')) {
                            const formData = new URLSearchParams();
                            formData.append('payload', JSON.stringify({ action: 'delete', taskId: id }));

                            fetch(this.webAppUrl, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                body: formData.toString()
                            }).then(() => {
                                this.notification = 'Task terhapus dari aplikasi & Google Sheets!';
                            }).catch(err => {
                                console.error(err);
                            });
                        }
                    }
                },
                formatDate(dateStr) {
                    if (!dateStr) return '';
                    const d = new Date(dateStr);
                    if (isNaN(d.getTime())) return dateStr;
                    return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear().toString().slice(-2);
                },


                exportCSV() {
                    if(this.records.length === 0) { alert('Tidak ada data'); return; }
                    const headers = Object.keys(this.records[0]);
                    let csv = headers.join(',') + '\n';
                    this.records.forEach(r => {
                        csv += headers.map(h => {
                            let v = r[h] || '';
                            if(typeof v === 'string' && (v.includes(',') || v.includes('"'))) v = '"' + v.replace(/"/g, '""') + '"';
                            return v;
                        }).join(',') + '\n';
                    });
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'IT_Support_Records.csv';
                    a.click();
                    URL.revokeObjectURL(url);
                    this.notification = 'CSV berhasil di-export!';
                },
                get filteredRecords() {
                    return this.records.filter(r => {
                        const s = this.search.toLowerCase();
                        const matchS = !s || Object.values(r).some(v => String(v).toLowerCase().includes(s));
                        const matchSt = !this.filterStatus || r.STATUS === this.filterStatus;
                        return matchS && matchSt;
                    });
                }
            }
        }
    </script>
</body>
